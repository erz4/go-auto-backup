name: Go Lint & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install dependencies
        run: go mod tidy
      - name: Lint
        run: go vet ./...

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install dependencies
        run: go mod tidy
      - name: Set version env
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Build for macOS
        run: go build -ldflags "-X main.Version=${VERSION}" -o go-auto-backup-mac ./main.go
      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: go-auto-backup-mac
          path: go-auto-backup-mac

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install dependencies
        run: go mod tidy
      - name: Set version env
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Build for Windows
        run: go build -ldflags "-X main.Version=${VERSION}" -o go-auto-backup.exe ./main.go
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: go-auto-backup-windows
          path: go-auto-backup.exe
